[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hons"
version = "0.1.0"
description = "Select network thresholds using persistent homology."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Russell J. Funk", email = "rfunk@umn.edu"}]
keywords = ["persistent homology", "network thresholding", "topological data analysis"]
classifiers = ["Intended Audience :: Science/Research", "Topic :: Scientific/Engineering", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]
dependencies = ["numpy>=1.26.4,<3", "pandas>=2.1.4,<4", "gudhi>=3.10.1,<3.12", "networkx>=3.2,<4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]

[project.urls]
Source = "https://github.com/rfunklab/hons"
Issues = "https://github.com/rfunklab/hons/issues"

[tool.setuptools]
py-modules = ["hons"]
package-dir = {"" = "src"}

name: Tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl "matplotlib>=3.8,<4"
      - run: python -m unittest discover -s tests -v
      - run: python examples/concept_network.py
      - run: python examples/network_demo.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.tar.gz
      - run: python -m unittest discover -s tests -v
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install . numpy==1.26.4 pandas==2.1.4 gudhi==3.10.1 networkx==3.2
      - run: python -m unittest discover -s tests -v
